    transform: scale(1.1);

  <body>

    <!-- The start of the form-->

    <h1 class="h1forapply"> JOB APPLICATION FORM  </h1>
    
    <form method="post" action = "https://mercury.swin.edu.au/it000000/formtest.php">
        <div class="form-container">  <!-- To set class for the whole form-->
          
          <div class="left-column">   <!-- Set the class for the left side of the form (personal info and desired role)-->
          <fieldset class = "form-section"> <!-- set class for the form fieldsets-->
           <legend> Personal Information </legend>
            <label for ="Ref_ID" > Job Reference Number: </label>
            <input type = "text" name = "Ref_ID" id = "Ref_ID" pattern = "[a-zA-Z0-9]{5}"  required>

            <!-- USE CSS TO PUT MARGIN OR SPACE MAYBE??-->

            <label for = "First_Name"> First Name: </label>
            <input type = "text" name = "First_Name" id = "First_Name" pattern = "[a-zA-Z]{2,20}" required>
            

            <label for = "Last_Name"> Last Name: </label>
            <input type = "text" name = "Last_Name" id = "Last_Name" pattern = "[a-zA-Z]{2,20}" required>

             

            <label for = "Date_Of_Birth"> Date of Birth: </label>
            <input type = "date" name = "Date_Of_Birth" id = "Date_Of_Birth" required>
            

            <div class="gender-group">
  <p class="field-label">Gender</p>
  
  <label class="input-option">
    <input type="radio" name="gender" value="male"> Male
  </label>
  <label class="input-option">
    <input type="radio" name="gender" value="female"> Female
  </label>
</div>
            <br>
            

            <label for = "Street_Address"> Street Address: </label>
            <input type = "text" name = "Street_Address" id = "Street_Address" pattern = "[a-zA-Z0-9\s]{5,40}" required>
            

            <label for = "Suburb"> Suburb/Town: </label>
            <input type = "text" name = "Suburb" id = "Suburb" pattern = "[a-zA-Z\s]{5,40}" required>

            

            <label for = "State"> State: </label>
            <select name = "State" id = "State" required>
                <option value = ""> Please Select </option>
                <option value = "VIC"> Victoria </option>
                <option value = "NSW"> New South Wales</option>
                <option value = "QLD"> Queensland </option>
                <option value = "NT"> Northern Territory </option>
                <option value = "WA"> Western Australia </option>
                <option value = "SA"> South Australia </option>
                <option value = "TAS"> Tasmania </option>
                <option value = "ACT"> Australian Capital Territory </option>
            </select>
            

            <label for = "Postcode"> Postcode: </label>
            <input type = "text" name = "Postcode" id = "Postcode" pattern = "[0-9]{4}" placeholder = "Eg. 3000" required>

            

            <label for = "Email"> Email: </label>
            <input type = "email" name = "Email" id = "Email" placeholder = "Eg. example@email.com" required>

            

            <label for = "Phone_Number"> Phone Number: </label>
            <input type = "text" name = "Phone_Number" id = "Phone_Number" pattern = "[0-9]{8,12}" placeholder = "Enter phone number" required>

            
         
           
         </fieldset>
         


    
        

         <div class = "desired-column">  <!-- set class just for this part-->
        <fieldset class = "form-section">
        
           <legend>Desired Role:</legend>
           
           <label class="input-option">
              <input type="radio" name="Desired_Role" value="Front-End Developer" required>
              <span>Front-End Developer</span>
            </label>

            <label class="input-option">
              <input type="radio" name="Desired_Role" value="Back-end Developer" required>
              <span>Back-end Developer</span>
            </label>

            <label class="input-option">
              <input type="radio" name="Desired_Role" value="Vulnerability Analyst" required>
              <span>Vulnerability Analyst</span>
            </label>

            <label class="input-option">
              <input type="radio" name="Desired_Role" value="Helpdesk Technician" required>
              <span>Helpdesk Technician</span>
            </label>
          </fieldset>
        </div>
      </div>
      

        <div class = "right-column"> <!-- set class for the right side of the form (Skills)-->
        <fieldset class = "form-section">

            <legend>Soft/Technical Skills:</legend>
        
    
            
            
            <label class="input-option"> <!-- To Style the input buttons so that it aligns with the text-->
            <input type="checkbox" name="Skill_List[]" value="Communication" checked>
            <span>Communication</span>
          </label>

          <label class="input-option">
            <input type="checkbox" name="Skill_List[]" value="Teamwork">
            <span>Teamwork</span>
          </label>

          <label class="input-option">
            <input type="checkbox" name="Skill_List[]" value="Problem_Solving">
            <span>Problem Solving</span>
          </label>

          <label class="input-option">
            <input type="checkbox" name="Skill_List[]" value="Adaptability">
            <span>Adaptability</span>
          </label>

          <label class="input-option">
            <input type="checkbox" name="Skill_List[]" value="Computer_Literacy">
            <span>Computer Literacy</span>
          </label>

          <label class="input-option">
            <input type="checkbox" name="Skill_List[]" value="Spreadsheet_Modelling_Master">
            <span>Spreadsheet and Modelling Mastery</span>
          </label>

          <label class="input-option">
            <input type="checkbox" name="Skill_List[]" value="Programming">
            <span>Programming</span>
          </label>

          <label class="input-option">
            <input type="checkbox" name="Skill_List[]" value="Cybersecurity">
            <span>Cybersecurity</span>
          </label>

          <label class="input-option">
            <input type="checkbox" name="Skill_List[]" value="Data_Science_Analytics">
            <span>Data Science and Analytics</span>
          </label>
        

          

        
        
           <label for="Other_Skills">Other Skills or previous work experience:</label>
           <textarea placeholder="Please specify any other relevant skills..." name="Other_Skills" id="Other_Skills" rows="25" cols="40"></textarea>

           <label for="file-upload">Upload Qualifications or Certificates of Achievement</label> <!--allow users to upload files to the form-->
  
           <input type="file" multiple id="file-upload" name="uploaded_file" class="file-button">
        
        </fieldset>
        </div> 

           <div class ="submit-button-container">
           <input type = "submit" value = "Submit" class="submit-button">
           </div>

      </div>
    </form>
